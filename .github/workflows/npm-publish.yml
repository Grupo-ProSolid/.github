name: Publish NPM Packages

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: false
        default: '22'
        type: string
      package-paths:
        description: 'JSON array of package paths to publish'
        required: true
        type: string
      build-order:
        description: 'JSON array of package paths in build order (defaults to package-paths)'
        required: false
        type: string
      ignore-conflict:
        description: 'If true, ignores publication errors (e.g., 409 Version Conflict) and continues'
        required: false
        default: false
        type: boolean
    secrets:
      npm-token:
        description: 'NPM authentication token'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@Grupo-ProSolid'

      - name: Install dependencies
        run: npm install --no-package-lock --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}

      - name: Build packages
        run: |
          set -e
          BUILD_ORDER='${{ inputs.build-order }}'
          if [ -z "$BUILD_ORDER" ]; then
            BUILD_ORDER='${{ inputs.package-paths }}'
          fi
          echo "$BUILD_ORDER" | jq -r '.[]' | while read path; do
            echo "Building $path"
            if [ "$path" = "." ]; then
              npm run build
            else
              npm run build -w "$path"
            fi
          done

      - name: Publish packages
        run: |
          PATHS='${{ inputs.package-paths }}'
          IGNORE_CONFLICT="${{ inputs.ignore-conflict }}"

          echo "$PATHS" | jq -r '.[]' | while read path; do
            echo "Publishing $path"
            
            # Preparamos el comando según el path
            if [ "$path" = "." ]; then
              CMD="npm publish --access public"
            else
              CMD="npm publish -w \"$path\" --access public"
            fi

            # Ejecutamos evaluando si debemos omitir el error de versión existente
            if eval "$CMD"; then
              echo "✅ Successfully published $path"
            else
              if [ "$IGNORE_CONFLICT" = "true" ]; then
                echo "⚠️ Failed to publish $path (likely version conflict / 409). Skipping as ignore-conflict is enabled."
              else
                echo "❌ Failed to publish $path."
                exit 1
              fi
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}

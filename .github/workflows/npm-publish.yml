name: Publish NPM Packages

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: false
        default: '20'
        type: string
      package-paths:
        description: 'JSON array of package paths to publish'
        required: true
        type: string
      build-order:
        description: 'JSON array of package paths in build order (defaults to package-paths)'
        required: false
        type: string
    secrets:
      npm-token:
        description: 'NPM authentication token'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@Grupo-ProSolid'

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}

      - name: Build packages
        run: |
          BUILD_ORDER='${{ inputs.build-order }}'
          if [ -z "$BUILD_ORDER" ]; then
            BUILD_ORDER='${{ inputs.package-paths }}'
          fi
          echo "$BUILD_ORDER" | jq -r '.[]' | while read path; do
            echo "Building $path"
            if [ "$path" = "." ]; then
              npm run build || true
            else
              npm run build -w "$path" || true
            fi
          done

      - name: Publish packages
        run: |
          PATHS='${{ inputs.package-paths }}'
          echo "$PATHS" | jq -r '.[]' | while read path; do
            echo "Publishing $path"
            if [ "$path" = "." ]; then
              npm publish --access public || true
            else
              npm publish -w "$path" --access public || true
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}

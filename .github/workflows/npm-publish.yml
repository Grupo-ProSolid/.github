name: Publish NPM Packages

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: false
        default: '22'
        type: string
      package-paths:
        description: 'JSON array of package paths to publish'
        required: true
        type: string
      build-order:
        description: 'JSON array of package paths in build order (defaults to package-paths)'
        required: false
        type: string
      ignore-conflict:
        description: 'If true, a package whose version is already published is skipped instead of failing the run'
        required: false
        default: false
        type: boolean
      dry-run:
        description: 'If true, builds and resolves versions but publishes nothing'
        required: false
        default: false
        type: boolean
      tag:
        description: 'dist-tag de npm publish. Vacío = se deriva de la versión (X.Y.Z-<preid>.N → <preid>; estable → latest)'
        required: false
        default: ''
        type: string
    secrets:
      npm-token:
        description: 'NPM authentication token'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@Grupo-ProSolid'

      # Antes de construir nada: decidir qué se publica y qué no.
      #
      # Antes el workflow publicaba siempre y dejaba que el registro
      # respondiera 409 si la versión ya existía. Con ignore-conflict activo
      # eso se tragaba CUALQUIER fallo de publicación, no solo el conflicto de
      # versión: unas credenciales malas o un tarball roto pasaban por "ya
      # publicado". Ahora la comprobación es explícita, y un fallo real de
      # `npm publish` rompe el run siempre.
      - name: Resolve what to publish
        id: plan
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
          PACKAGE_PATHS: ${{ inputs.package-paths }}
          IGNORE_CONFLICT: ${{ inputs.ignore-conflict }}
        run: |
          set -euo pipefail
          to_publish=""
          skipped=""
          conflict=0

          for path in $(echo "$PACKAGE_PATHS" | jq -r '.[]'); do
            name=$(jq -r .name "$path/package.json")
            version=$(jq -r .version "$path/package.json")

            if npm view "$name@$version" version >/dev/null 2>&1; then
              if [ "$IGNORE_CONFLICT" = "true" ]; then
                echo "⏭  $name@$version ya está publicado, se omite"
                skipped="$skipped $name@$version"
              else
                echo "::error::$name@$version ya está publicado. Sube la versión, o relanza con ignore-conflict."
                conflict=1
              fi
              continue
            fi

            echo "→ $name@$version se publicará"
            to_publish="$to_publish $path"
          done

          if [ $conflict -ne 0 ]; then
            exit 1
          fi

          if [ -z "$to_publish" ]; then
            echo "Nada que publicar."
          fi

          {
            echo "paths=$(echo $to_publish)"
            echo "skipped=$(echo $skipped)"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --no-package-lock --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}

      - name: Build packages
        env:
          BUILD_ORDER: ${{ inputs.build-order }}
          PACKAGE_PATHS: ${{ inputs.package-paths }}
        run: |
          set -euo pipefail
          order="$BUILD_ORDER"
          if [ -z "$order" ]; then
            order="$PACKAGE_PATHS"
          fi
          # Se construye SIEMPRE todo el build-order, aunque algún paquete no
          # se vaya a publicar: el que sí se publica puede depender de su dist.
          for path in $(echo "$order" | jq -r '.[]'); do
            echo "Building $path"
            if [ "$path" = "." ]; then
              npm run build
            else
              npm run build -w "$path"
            fi
          done

      - name: Publish packages
        if: steps.plan.outputs.paths != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
          PATHS: ${{ steps.plan.outputs.paths }}
          DRY_RUN: ${{ inputs.dry-run }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for path in $PATHS; do
            name=$(jq -r .name "$path/package.json")
            version=$(jq -r .version "$path/package.json")

            if [ "$DRY_RUN" = "true" ]; then
              echo "🧪 dry-run: $name@$version NO se publica"
              continue
            fi

            # Sin --tag, npm publica en `latest` también los prereleases: así
            # acabó 0.1.0-cdn-test.0 del loader como `latest`.
            tag="$TAG_INPUT"
            if [ -z "$tag" ]; then
              pre=$(printf '%s' "$version" | sed -nE 's/^[0-9]+\.[0-9]+\.[0-9]+-([0-9A-Za-z-]+)(\..*)?$/\1/p')
              case "$pre" in
                "") tag="latest" ;;
                *[!0-9]*) tag="$pre" ;;
                *) tag="next" ;;  # preid numérico: npm no acepta un tag que parece un rango
              esac
            fi
            echo "Publishing $name@$version (--tag $tag)"
            if [ "$path" = "." ]; then
              npm publish --access public --tag "$tag"
            else
              npm publish -w "$path" --access public --tag "$tag"
            fi
            echo "✅ $name@$version publicado"
          done

      - name: Summary
        if: always()
        env:
          PUBLISHED: ${{ steps.plan.outputs.paths }}
          SKIPPED: ${{ steps.plan.outputs.skipped }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          {
            echo "### Publicación"
            if [ "$DRY_RUN" = "true" ]; then echo "_dry-run: no se publicó nada_"; fi
            echo ""
            echo "- Publicados: ${PUBLISHED:-ninguno}"
            echo "- Omitidos (ya publicados): ${SKIPPED:-ninguno}"
          } >> "$GITHUB_STEP_SUMMARY"

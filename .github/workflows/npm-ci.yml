name: NPM CI

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: false
        default: '20'
        type: string

      build-order:
        description: 'JSON array of package paths to build in order'
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: |
          if [ -n "${{ inputs.build-order }}" ]; then
            echo "${{ inputs.build-order }}" | jq -r '.[]' | while read path; do
              echo "Building $path"
              npm run build -w "$path" || true
            done
          else
            npm run build --workspaces --if-present
          fi

      - name: Run tests
        run: npm test --workspaces --if-present
